# Mantém atualizadas as dependências Go, as actions e as imagens base do
# Dockerfile. O yt-dlp, por ser um binário descarregado, atualiza-se com
# `make update-ytdlp`.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
