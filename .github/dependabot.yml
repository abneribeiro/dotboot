# Keeps the Go dependencies, the actions and the Dockerfile's base images up
# to date. yt-dlp, a downloaded binary, is updated with `make update-ytdlp`.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
