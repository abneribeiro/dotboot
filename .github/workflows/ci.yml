name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Página (svelte-check, prettier, vitest)
        working-directory: web
        run: |
          npm ci
          npm run check
          npm run lint
          npm test

      # O binário embute a página: os testes e a compilação cruzada correm
      # com ela lá dentro, como na release.
      - name: Build da página
        run: make web

      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "Por formatar (make fmt):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Testes
        run: go test -race ./...

      # O GoReleaser compila para estes sistemas; partir um deles só se veria
      # no dia da release.
      - name: Cross-compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "→ $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build -o /dev/null ./cmd/dotboot
          done

      - name: Scripts de instalação
        run: shellcheck scripts/*.sh scripts/dotboot-docker

  docker:
    # Só na main: a imagem demora a construir e um PR raramente mexe nela.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Imagem (dotboot:latest)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
