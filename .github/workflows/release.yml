name: Release

# A vX.Y.Z tag (make release VERSION=vX.Y.Z) publishes the binaries for every
# platform as a GitHub release, with checksums.txt.
on:
  push:
    tags: ["v*"]
  # Rebuilds the release of an existing tag (pick the tag as the ref).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser needs the history and the tags for the changelog.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
