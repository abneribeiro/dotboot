services:
  videobot:
    build:
      context: .
      target: production
      network: host
    env_file: .env
    restart: unless-stopped
    network_mode: host
    healthcheck:
      test: ["CMD", "pgrep", "-f", "/dotboot"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits to prevent excessive memory/CPU usage
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    # Improved logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  videobot-dev:
    profiles: ["dev"]
    build:
      context: .
      target: development
      network: host
    env_file: .env
    network_mode: host
    volumes:
      # Mount source code for live reload
      - .:/app
      # Cache Go modules to avoid re-downloading on every restart
      - go-modules:/go/pkg/mod
    working_dir: /app
    # Override healthcheck for development (Air process)
    healthcheck:
      test: ["CMD", "pgrep", "-f", "air"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Improved logging for development
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  go-modules:
