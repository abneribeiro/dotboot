services:
  videobot:
    build:
      context: .
      target: production
      network: host
    env_file: .env
    restart: unless-stopped
    # Verifica o heartbeat que o bot escreve enquanto está ligado ao Discord
    # (ver HEALTHCHECK no Dockerfile).
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/dotboot.alive -newermt '-90 seconds' 2>/dev/null | grep -q ."]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Resource limits to prevent excessive memory/CPU usage.
    # A compressão de vídeo (x264) é o consumidor dominante: com 0.5 CPU um
    # encode não termina dentro dos 15 minutos do token da interação.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '2.0'
    # Improved logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  videobot-dev:
    profiles: ["dev"]
    build:
      context: .
      target: development
      network: host
    env_file: .env
    volumes:
      # Mount source code for live reload
      - .:/app
      # Cache Go modules to avoid re-downloading on every restart
      - go-modules:/go/pkg/mod
    working_dir: /app
    # Override healthcheck for development (Air process)
    healthcheck:
      test: ["CMD", "pgrep", "-f", "air"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Improved logging for development
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  go-modules:
